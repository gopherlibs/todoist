name: "Trunk WF"

on:
  push:
    tags:
    - "*"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6.0.1
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v6.1.0
      with:
        go-version-file: 'go.mod'
    - uses: goreleaser/goreleaser-action@v6.4.0
      with:
        version: '2.13.3'
        args: "release --clean"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
